timezone_offset: 3

# --- Время в конфиге (ревизия) ---
# - trading.block_entry_utc_hours, session_flatten.utc_hours, exit.early_exit_session_utc_hours — в UTC.
# - scalp.*_hours_local, strategy_presets.auto_impulse_local_hours — локальные часы (UTC+timezone_offset, у вас +3 = МСК).
# - block_entry: полный запрет entry-scan в этот час UTC.
# - session_flatten: опционально — то же, но пакетное закрытие; по умолчанию выкл. (см. session_flatten.enabled).
# - strategy_presets: при enabled=true режет порог/OF/block поверх базы; auto смотрит auto_impulse_local_hours (= часы pump∪dump из scalp, отсортировано).

bybit:
  testnet: false
  category: linear

bot:
  candle_interval: "5"
  htf_interval: "60"
  htf_4h_interval: "240"
  cycle_sleep_sec: 120
  scan_interval_sec: 120
  # Минимальная пауза перед повторным анализом того же символа (снижает нагрузку на Bybit API).
  min_symbol_rescan_sec: 45
  scan_interval_active_hours_sec: 60
  position_active_sleep_sec: 15
  klines_limit: 180
  feature_window: 128
  liquidation_stream_symbols: 15
  signal_only: false
  # В режиме signal-only: отправка в Telegram и регистрация в feedback только если confidence строго выше этого порога (0.90 = >90%).
  signal_only_min_confidence: 0.90
  signal_cooldown_sec: 5400
  # Per-stage timeout inside trading cycle (network/API bound awaits).
  runtime_stage_timeout_sec: 60
  # Timeout for heavier stages (position management / entry scan).
  runtime_scan_timeout_sec: 240
  # Log + optional Telegram: top-3 scan reject buckets every N seconds (default 4h).
  reject_stats_report_interval_sec: 14400
  reject_stats_telegram: true

# ========================================
# STRATEGY PRESETS (impulse day vs defensive SMC) — optional overlays on entryThreshold / orderflow / block hours
# Set enabled: true to activate. mode: auto uses local hours (UTC+auto_timezone_offset).
# ========================================
strategy_presets:
  enabled: false
  mode: auto
  notify_telegram: false
  auto_timezone_offset: 3
  # = union(scalp.pump_hours_local, scalp.dump_hours_local), sorted (без дублей)
  auto_impulse_local_hours: [3, 4, 5, 7, 11, 13, 14, 18, 19, 20, 21]
  impulse:
    entry_threshold: 0.66
    min_orderflow_imbalance: 0.055
    # чуть мягче block, чем defensive (нет 13 UTC — больше попыток входа)
    block_entry_utc_hours: [5, 6, 8, 12, 21, 23]
  defensive:
    entry_threshold: 0.72
    min_orderflow_imbalance: 0.07
    # совпадает с trading.block_entry_utc_hours
    block_entry_utc_hours: [5, 6, 8, 12, 13, 21, 23]

# ========================================
# SCALP SESSION MODE (Asian + hot hours)
# ========================================
# Local hours in UTC+3:
# - User requested: 03, 04, 05
# - Added from volatility analysis hot windows:
#   pump: 07, 11, 14, 18
#   dump: 13, 19, 20, 21
scalp:
  enabled: true
  timezone_offset: 3
  pump_hours_local: [3, 4, 5, 7, 11, 14, 18]
  dump_hours_local: [3, 4, 5, 13, 19, 20, 21]
  min_impulse_pct: 0.45
  min_confirm_move_pct: 0.55
  min_volume_ratio: 1.0
  confirm_bars: 3
  cooldown_bars: 6
  hardgate_orderflow_relax_mult: 0.65
  orderflow_hardgate_floor: 0.05
  skip_orderbook_direction_guard: true
  skip_impulse_retest_guard: true
  impulse_retest_bypass_confidence: 0.90
  quality_gate_bypass_confidence: 0.90
  quality_min_confidence: 0.84
  quality_min_expected_edge: 0.40
  mtf_single_tf_min_confidence: 0.84

trading:
  position_size_mode: "margin_cap"  # margin_cap | risk_based
  capital_weight_mode: "equal"      # score | equal
  leverage: 10
  margin_total_pct: 10.0
  risk_per_trade_pct: 0.7
  max_positions: 4
  min_position_usdt: 5.0
  trailing_stop_pct: 1.3
  tp_pct: 2.0
  sl_pct: 1.2
  blacklist_symbols: ["WLFIUSDT", "AZTECUSDT", "MYXUSDT", "PNUTUSDT", "ORDIUSDT", "AAVEUSDT", "SOONUSDT", "MOVRUSDT"]
  # Стартовые (UTC) «плохие» часы. 9 и 19 убраны (больше окон); 12/13 — перекрёсток сессий, оставлены.
  # Для субаккаунта/лонг можно сузить список отдельной копией config.
  block_entry_utc_hours: [5, 6, 8, 12, 13, 21, 23]

entry:
  transformer_threshold: 0.60
  max_liq_distance_pct: 1.30
  # Normalized imbalance [-1..1]; slight relax for better fill rate.
  min_orderflow_imbalance: 0.065
  min_rr_ratio: 3.0
  min_target_profit_pct: 1.5
  require_structural_tp: true
  min_stop_distance_pct: 1.5
  min_stop_atr_mult: 1.6
  sl_buffer_atr_mult: 1.0
  max_entry_extension_atr: 1.05
  entry_range_atr_mult: 0.22
  allowed_regimes: ["trend", "breakout"]
  zone_proximity_pct: 0.4
  max_spread_pct: 0.11
  # Bybit fundingRate is decimal per interval (e.g. 0.012 = ~1.2%). Old 0.05 rarely filtered pumps.
  max_funding_rate: 0.012
  # If |24h change| >= this percent (from price24hPcnt), apply stricter funding cap (mover / squeeze).
  funding_tight_if_abs_24h_change_pct: 16.0
  max_funding_rate_for_mover: 0.009
  # Минимальный composite / confidence для входа (ослаблено для большего потока).
  entry_threshold: 0.70
  # Мягкий пол: между soft и hard composite проходят в пайплайн (для BPR-ранжирования в цикле).
  entry_threshold_soft: 0.60
  trained_model_enabled: false
  trained_model_min_prob: 0.52
  trained_model_blend: 0.00
  trained_model_weights_path: "bot/transformer_weights.pt"
  min_liq_depth: 0.0
  min_smc_score: 0.55
  min_volatility_pct: 0.007
  require_sweep: false
  require_4h_trend: false
  strict_htf_mode: false
  volatility_floor_enabled: true
  volatility_floor_atr_pct: 0.007
  ema_trend_filter: true
  ema_fast_period: 20
  ema_slow_period: 50
  # EMA guard only when fast/slow differ by at least this % (skip borderline ~0.8% disagreements).
  ema_guard_min_diff_pct: 0.80
  momentum_filter: true
  momentum_lookback: 5
  momentum_guard_min_pct: 0.15
  # Require stronger 5-bar counter-move before veto (reduces noise rejects on 0.2–2% wicks).
  buy_momentum_guard_min_pct: 2.0
  sell_momentum_guard_min_pct: 1.2
  volume_filter: true
  volume_lookback: 20
  volume_guard_min_ratio: 0.26
  buy_volume_guard_min_ratio: 0.10
  sell_volume_guard_min_ratio: 0.10
  counter_flow_guard_mult: 2.3
  direction_tiebreaker_prob_gap: 0.06
  guard_confidence_bypass: 0.90
  anti_peak_guard_enabled: true
  anti_peak_lookback: 24
  anti_peak_atr_buffer_mult: 0.35
  # Below this composite, block entries very close to local high/low (raise = stricter peak filter).
  peak_confidence_bypass: 0.90
  impulse_retest_confirm_enabled: true
  missing_bos_min_confidence: 0.90
  impulse_min_body_atr: 0.45
  retest_max_body_ratio: 0.85
  confirm_min_body_ratio: 0.35
  impulse_confirm_confidence_bypass: 0.90

market_structure:
  swing_lookback: 2
  volume_spike_mult: 2.0
  bos_volume_mult: 1.5
  spread_expansion_mult: 1.5

pyramid:
  enabled: false
  max_adds: 2
  add_on_pullback: true
  add_on_continuation: true
  max_total_risk_pct: 2.0
  add1_min_r: 0.5
  add2_min_r: 1.2

heatmap:
  cluster_step: 20
  max_levels: 10

atr:
  period: 14
  min_atr_pct: 0.20

exit:
  hard_sl_atr_mult: 2.5
  early_exit_bars: 72
  early_exit_min_profit_atr: 0.35
  # Не закрывать early_exit по «тихому» рынку раньше N минут реального времени (защита от мгновенного выноса комиссиями).
  early_exit_min_hold_minutes: 90
  # В указанные UTC-часы повысить требуемый min_profit_atr для early_exit (меньше ложных срезов в шумной сессии).
  early_exit_session_utc_hours: [3, 4, 5, 6, 7, 8, 9]
  early_exit_session_min_profit_atr_boost: 0.2
  # Запретить early_exit закрывать позицию, пока текущий PnL <= 0.
  early_exit_allow_loss_close: false
  # Дополнительная проверка логичности/корректности досрочного закрытия перед исполнением.
  early_exit_validator_enabled: true
  # Медленнее включается трейлинг и шире дистанция от экстремума (меньше «дёрганья» на пампах).
  trailing_activation_atr: 2.2
  trailing_distance_atr: 2.8
  # Минимум дистанции трейла как % от цены (доп. пол в движке; расширяет эффективный trail).
  trailing_min_distance_pct: 1.0
  # С какого R учитывать последний swing как поддержку/сопротивление (раньше было жёстко 2R).
  trailing_structural_r_threshold: 1.75
  # Лонг: стоп чуть ниже swing low; шорт: чуть выше swing high (в долях ATR).
  trailing_swing_buffer_atr_mult: 0.4
  tp_cap_atr_mult: 10.0
  min_profit_before_trail_pct: 0.85
  sl_buffer_atr_mult: 0.5
  fee_rate: 0.001
  ema_trend_exit: true
  ema_exit_period: 20
  # v3 anti-whipsaw: сильнее игнорируем шум/микро-откаты перед trend_exit.
  ema_exit_buffer_pct: 0.80
  ema_exit_confirm_bars: 5
  ema_trend_exit_confirm_bars: 7
  ema_exit_require_ema_slope: true
  ema_trend_exit_require_ema_slope: true
  # Защита от закрытия на разворотной свече после резкого отката (recovery bounce).
  ema_trend_exit_recovery_cancel_enabled: true
  ema_trend_exit_recovery_lookback_bars: 8
  ema_trend_exit_recovery_min_ratio: 0.80
  ema_trend_exit_recovery_min_adverse_pct: 0.55
  # Slightly higher threshold to ignore tiny +/-0.5% noise around entry.
  ema_exit_min_adverse_from_entry_pct: 1.60

risk:
  max_daily_loss_pct: 10.0
  max_daily_loss_usdt: 10
  max_trades_per_day: 50
  max_consecutive_losses: 3
  cooldown_after_loss_sec: 900
  cooldown_after_stop_hours: 0.25
  max_trades_per_symbol_24h: 4
  reduce_after_losses: 2
  reduction_factor: 0.30
  min_loss_usdt_for_cooldown: 0.35
  min_loss_usdt_for_consecutive: 0.15
  ignore_loss_cooldown_reasons: ["early_exit", "exchange_closed"]
  ignore_consecutive_loss_reasons: ["early_exit", "exchange_closed"]
  symbol_loss_streak_cooldown_enabled: true
  symbol_loss_streak_threshold: 1
  symbol_loss_streak_limit: 1
  symbol_loss_streak_cooldown_sec: 21600
  # v2: после убыточного trend_exit блокируем повторный вход по символу на 12 часов.
  trend_exit_reentry_cooldown_enabled: true
  trend_exit_reentry_cooldown_sec: 43200
  trend_exit_reentry_loss_only: true
  # Anti-whipsaw: после любого early_exit блокируем повторный вход по символу на 60 минут.
  early_exit_reentry_cooldown_enabled: true
  early_exit_reentry_cooldown_sec: 3600

session_flatten:
  # Принудительное закрытие перед сессиями: выключено — оставьте false и пользуйтесь block_entry / трейлингом / гвардами.
  enabled: false
  # При enabled: true — UTC-час, перед которым (lead_minutes) закрыть всё. Список оставлен для справки.
  utc_hours: [6, 8, 12, 13, 21]
  lead_minutes: 10

market:
  min_24h_volume_usdt: 25000000
  max_symbols: 50
  trade_symbols: 25
  whitelist_enabled: true
  whitelist_only: false
  whitelist_symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "LINKUSDT", "BNBUSDT"]
  blacklist_substrings:
    - "1000"
    - "LUNA"
    - "UST"
    - "BUSD"
  momentum_top_n: 8

ai:
  enabled: true
  # emergent = Gemini (EMERGENT_LLM_KEY) | ollama = локальная Gemma (+Gemma.txt: ollama pull)
  backend: ollama
  # Для ollama 60–75 реалистично; 90 оставляйте для облачного Gemini.
  min_confidence: 68
  fail_open: true
  require_direction_match: true
  uniformity_guard_enabled: true
  uniformity_window: 8
  uniformity_conf_spread_max: 3

# Локальная Gemma через Ollama (бесплатно на своём ПК/VPS). Не отключает Quality Gate.
gemma:
  enabled: true
  model: "gemma2:2b"
  host: "http://127.0.0.1:11434"
  timeout_sec: 12
  fail_open: true

ai_claude:
  enabled: false
  gateway_url: "ws://127.0.0.1:18789"
  timeout_sec: 20.0
  max_tokens: 300
  confidence_threshold: 70
  strict_min_confidence: 65
  min_confidence: 65
  fail_open: true
  enforce_direction_match: true

advisor:
  enabled: true
  mode: "advisory"        # enforce | advisory | disabled
  min_rr: 1.8
  min_confidence: 0.58
  min_edge: 0.35
  max_spread_pct: 0.12
  min_atr_pct: 0.03
  min_abs_imbalance: 0.06
  allow_countertrend: false
  allow_chop: true

rl:
  enabled: false
  add_threshold: 0.78
  reduce_threshold: 0.7
  close_threshold: 0.8
  min_close_profit_pct: 0.5
  max_panic_loss_pct: 0.6
  min_reduce_profit_pct: 0.8

# +Gemma.txt: Meta-Controller / RL meta / Hybrid voting (по умолчанию выкл. — не ломает прод)
meta_controller:
  enabled: false
  # Пусто = взять adaptive_regime_presets.benchmark_symbol (обычно BTCUSDT)
  benchmark_symbol: ""
  kline_interval: "60"
  klines_lookback: 120
  chaos_volatility: 0.02
  trend_strength: 0.001
  max_entry_drawdown_abs: 0.10
  safe_drawdown_abs: 0.05

rl_meta:
  enabled: false
  # На 1GB VPS оставьте false — DQN требует torch
  use_torch: false
  lr: 0.0005
  gamma: 0.9
  block_scan_on_no_trade: true
  # 0 = не вызывать train в цикле; положите 5..20 если torch включён
  train_every_n_closes: 0

hybrid_voter:
  enabled: false
  threshold: 0.2
  # порог += dynamic_threshold_vol_scale * vol_бенчмарка
  dynamic_threshold_vol_scale: 0.0
  require_side_match: true
  weights:
    xgb: 0.4
    gemma: 0.3
    ta: 0.3

position_sync:
  adopt_all_positions: true
  preserve_existing_sl_tp: true
  exchange_closed_confirm_cycles: 8
  exchange_closed_require_closed_pnl: true
  exchange_closed_force_cycles: 30
  exchange_closed_reentry_cooldown_sec: 600
  pause_exchange_closed_after_rate_limit_sec: 180

partial_tp:
  enabled: true
  trigger_progress: 0.5
  close_fraction: 0.5
  move_stop_to_entry: true

portfolio_tp:
  enabled: false
  target_profit_pct: 2.0

basket_profit_guard:
  enabled: true
  min_positions: 3
  # История PnL за окно (сек); держите шире, чем горизонт «пик→сейчас» (например 15 мин), иначе пик увидеть нельзя.
  monitor_window_sec: 900
  symbol_pnl_drop_pct: 40.0
  total_drawdown_pct_after_symbol_drop: 15.0
  min_symbol_peak_profit_usdt: 0.5
  min_total_profit_usdt: 1.0
  # Подтверждение просадки PnL по символу: в обычное время (сек).
  drawdown_confirm_sec: 900
  # Укороченное подтверждение только в локальные «скальп»-часы (pump|dump, как в strategy_presets.auto_impulse_local_hours).
  fast_drawdown_confirm_sec: 300
  fast_drawdown_confirm_local_hours: [3, 4, 5, 7, 11, 13, 14, 18, 19, 20, 21]
  # Пусто/не указывать = взять timezone_offset из корня config (у вас +3).
  # fast_drawdown_confirm_timezone_offset: 3

profit_drawdown_guard:
  enabled: true
  activation_profit_pct: 3.0
  retrace_from_peak_pct: 25.0
  # Секунды удержания в зоне отката от пика перед закрытием (снимает выход на одном фитиле, пока тренд живёт).
  retrace_confirm_sec: 90
  # Не закрывать profit_drawdown_guard, пока локальный EMA-тренд (fast/slow) еще в сторону позиции.
  require_trend_break: true
  trend_ema_fast: 20
  trend_ema_slow: 50
  # Доп. анализ структуры отката по всему символу перед финальным закрытием.
  pullback_analysis_enabled: true
  pullback_lookback_bars: 60
  pullback_min_adverse_pct: 2.5
  pullback_cancel_recovery_ratio: 0.35
  pullback_max_range_pct: 9.0

manual_management:
  rl_enabled: false
  preserve_existing_tp: true
  trailing_activation_atr: 2.2
  trailing_distance_atr: 2.8
  trailing_min_distance_pct: 1.8
  notify_on_adopt: true
  notify_on_partial_tp: true
  notify_on_sl_move: true

profit_lock:
  min_profit_pct: 25.0
  decline_threshold_pct: 20.0
  decline_duration_sec: 480
  cooldown_sec: 3600

feedback_loop:
  enabled: true
  # true = daily retrain runs inside the bot (async to_thread). false = only cron: scripts/run_feedback_retrain.sh
  retrain_in_process: true
  notify_labeling: true
  max_pending_hours: 12
  dataset_path: "signal_only_feedback_data.json"
  base_dataset_path: "training_data.json"
  queue_path: "signal_feedback_queue.json"
  state_path: "signal_feedback_state.json"
  retrain_daily: true
  retrain_hour_utc: 1
  min_new_labels_for_retrain: 150
  use_merged_dataset_for_retrain: true
  apply_to_risk_guard: false
  min_feedback_label_abs_pnl_pct: 0.4
  min_feedback_label_hold_minutes: 8
  train_epochs: 220
  train_lr: 0.002
  train_batch_size: 32
  train_val_ratio: 0.2
  train_decision_threshold: 0.55
  train_seed: 42
  augment_wins_factor: 2
  augment_noise_std: 0.03

quality_gate:
  enabled: true
  min_confidence: 0.86
  # Порог «сильного сигнала» для обходов chop / no_zone (должен совпадать с мин. входом).
  strong_signal_min_confidence: 0.86
  strong_signal_min_smc: 0.86
  min_expected_edge: 0.40
  anti_flat_min_adx: 12.5
  anti_flat_min_atr_pct: 0.08
  anti_flat_min_abs_imbalance: 0.06
  anti_flat_allow_chop: false
  chop_bypass_enabled: true
  chop_bypass_min_confidence: 0.86
  chop_bypass_min_abs_imbalance: 0.12
  chop_bypass_require_zone: true
  anti_flat_require_htf_trend: false
  countertrend_min_confidence: 0.86
  countertrend_min_abs_imbalance: 0.24
  no_zone_min_confidence: 0.86
  reject_no_zone_entries: false

symbol_quality:
  # Off: feedback-based filter was blocking symbols with history (see rejects symbol_quality_low_quality).
  enabled: false
  dataset_path: "signal_only_feedback_data.json"
  feedback_only: true
  whitelist_bypass: true
  min_trades: 4
  min_winrate: 0.40
  min_avg_pnl_pct: -1.2
  max_recent_losses: 10
  lookback_per_symbol: 30
  cache_ttl_sec: 180

correlation:
  enabled: true
  threshold: 0.88
  max_correlated: 1
  lookback: 50

mtf_zone_confirmation:
  enabled: true
  require_any_zone: false
  min_confidence_if_single_tf: 0.86

# BPR-style linear ranker: blends into allocator signal_strength; optional Telegram top-N;
# when ≥2 candidates, keep only top-1 by BPR score (see top1_when_multiple).
bpr_ranker:
  enabled: true
  weights_path: "bpr_weights.json"
  blend_weight: 0.38
  top1_when_multiple: true
  telegram_top_n: 3

adaptive_regime_presets:
  enabled: true
  switch_interval_sec: 900
  notify_on_switch: true
  benchmark_symbol: "BTCUSDT"
  trend_strict_htf_mode: true
  trend_volatility_floor_atr_pct: 0.007
  trend_require_4h_trend: false
  range_strict_htf_mode: false
  range_volatility_floor_atr_pct: 0.02
  range_require_4h_trend: false


# Timeframe presets: "1m", "5m", "15m"
# Switching active_tf_preset adjusts candle_interval and related params automatically
tf_presets:
  active_preset: "5m"
  presets:
    1m:
      candle_interval: "1"
      htf_interval: "15"
      htf_4h_interval: "240"
      cycle_sleep_sec: 60
      position_active_sleep_sec: 15
      scan_interval_sec: 60
      klines_limit: 180
      early_exit_bars: 20
      trailing_activation_atr: 1.4
      trailing_distance_atr: 2.4
      volatility_floor_atr_pct: 0.007
      hard_sl_atr_mult: 2.5
    5m:
      candle_interval: "5"
      htf_interval: "60"
      htf_4h_interval: "240"
      cycle_sleep_sec: 120
      position_active_sleep_sec: 30
      scan_interval_sec: 120
      klines_limit: 120
      early_exit_bars: 45
      trailing_activation_atr: 2.0
      trailing_distance_atr: 2.6
      volatility_floor_atr_pct: 0.007
      hard_sl_atr_mult: 2.5
    15m:
      candle_interval: "15"
      htf_interval: "240"
      htf_4h_interval: "D"
      cycle_sleep_sec: 300
      position_active_sleep_sec: 60
      scan_interval_sec: 300
      klines_limit: 96
      early_exit_bars: 8
      trailing_activation_atr: 1.5
      trailing_distance_atr: 1.8
      volatility_floor_atr_pct: 0.15
      hard_sl_atr_mult: 3.0
    1h:
      candle_interval: "60"
