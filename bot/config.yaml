timezone_offset: 3

bybit:
  testnet: false
  category: linear

bot:
  candle_interval: "1"
  htf_interval: "15"
  htf_4h_interval: "240"
  cycle_sleep_sec: 60
  klines_limit: 180
  feature_window: 128
  liquidation_stream_symbols: 12
  signal_only: true
  signal_cooldown_sec: 3600

trading:
  leverage: 15
  margin_total_pct: 8.0
  risk_per_trade_pct: 0.4
  max_positions: 6
  min_position_usdt: 5.0
  trailing_stop_pct: 1.2
  tp_pct: 1.8
  sl_pct: 1.0
  blacklist_symbols: ["WLFIUSDT", "AZTECUSDT", "MYXUSDT"]

entry:
  transformer_threshold: 0.54
  max_liq_distance_pct: 1.30
  min_orderflow_imbalance: 1.10
  min_rr_ratio: 2.5
  min_target_profit_pct: 1.2
  min_stop_distance_pct: 0.5
  sl_buffer_atr_mult: 0.5
  allowed_regimes: ["trend", "breakout", "chop"]
  zone_proximity_pct: 0.4
  max_spread_pct: 0.08
  max_funding_rate: 0.05
  entry_threshold: 0.62
  trained_model_enabled: false
  trained_model_min_prob: 0.45
  trained_model_blend: 0.35
  trained_model_weights_path: "transformer_weights.pt"
  min_liq_depth: 0.0
  min_smc_score: 0.70
  min_volatility_pct: 0.04
  require_sweep: true
  require_4h_trend: true

market_structure:
  swing_lookback: 2
  volume_spike_mult: 2.0
  bos_volume_mult: 1.5
  spread_expansion_mult: 1.5

pyramid:
  enabled: true
  max_adds: 2
  add_on_pullback: true
  add_on_continuation: true
  max_total_risk_pct: 2.0
  add1_min_r: 0.5
  add2_min_r: 1.2

heatmap:
  cluster_step: 20
  max_levels: 10

atr:
  period: 14
  min_atr_pct: 0.20

exit:
  hard_sl_atr_mult: 2.5
  early_exit_bars: 0
  early_exit_min_profit_atr: 0.1
  trailing_activation_atr: 1.5
  trailing_distance_atr: 2.0
  tp_cap_atr_mult: 10.0
  min_profit_before_trail_pct: 0.6
  sl_buffer_atr_mult: 0.5

risk:
  max_daily_loss_pct: 4.0
  max_daily_loss_usdt: 50
  max_trades_per_day: 25
  max_consecutive_losses: 6
  cooldown_after_loss_sec: 120
  cooldown_after_stop_hours: 0.5
  max_trades_per_symbol_24h: 3
  reduce_after_losses: 3
  reduction_factor: 0.5

market:
  min_24h_volume_usdt: 15000000
  max_symbols: 50
  trade_symbols: 25
  whitelist_enabled: true
  whitelist_symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "LINKUSDT", "BNBUSDT"]
  blacklist_substrings:
    - "1000"
    - "LUNA"
    - "UST"
    - "BUSD"
  momentum_top_n: 8

ai:
  enabled: true
  min_confidence: 55
  fail_open: false

rl:
  enabled: false
  add_threshold: 0.78
  reduce_threshold: 0.7
  close_threshold: 0.8
  min_close_profit_pct: 0.5
  max_panic_loss_pct: 0.6
  min_reduce_profit_pct: 0.8

position_sync:
  adopt_all_positions: true
  preserve_existing_sl_tp: true

partial_tp:
  enabled: true
  trigger_progress: 0.5
  close_fraction: 0.5
  move_stop_to_entry: true

portfolio_tp:
  enabled: false
  target_profit_pct: 2.0

basket_profit_guard:
  enabled: true
  min_positions: 3
  monitor_window_sec: 900
  symbol_pnl_drop_pct: 40.0
  total_drawdown_pct_after_symbol_drop: 15.0
  min_symbol_peak_profit_usdt: 0.5
  min_total_profit_usdt: 1.0
  drawdown_confirm_sec: 900

profit_drawdown_guard:
  enabled: true
  activation_profit_pct: 3.0
  retrace_from_peak_pct: 25.0

manual_management:
  rl_enabled: false
  preserve_existing_tp: true
  trailing_activation_atr: 3.0
  trailing_distance_atr: 3.5
  notify_on_adopt: true
  notify_on_partial_tp: true
  notify_on_sl_move: true

profit_lock:
  min_profit_pct: 5.0
  decline_threshold_pct: 20.0
  decline_duration_sec: 300
  cooldown_sec: 3600

feedback_loop:
  enabled: true
  notify_labeling: true
  max_pending_hours: 12
  dataset_path: "training_data.json"
  queue_path: "signal_feedback_queue.json"
  state_path: "signal_feedback_state.json"
  retrain_daily: true
  retrain_hour_utc: 1
  min_new_labels_for_retrain: 8
  train_epochs: 220
  train_lr: 0.002
  train_batch_size: 32
  train_val_ratio: 0.2
  train_decision_threshold: 0.55
  train_seed: 42
  augment_wins_factor: 2
  augment_noise_std: 0.03

quality_gate:
  enabled: true
  min_confidence: 0.64
  min_expected_edge: 0.62
  anti_flat_min_adx: 14.5
  anti_flat_min_atr_pct: 0.16
  anti_flat_min_abs_imbalance: 0.06
  anti_flat_allow_chop: false
  anti_flat_require_htf_trend: false
