timezone_offset: 3

bybit:
  testnet: false
  category: linear

bot:
  candle_interval: "1"
  htf_interval: "15"
  cycle_sleep_sec: 60
  klines_limit: 180
  feature_window: 128
  liquidation_stream_symbols: 12

trading:
  leverage: 5
  margin_total_pct: 8.0
  risk_per_trade_pct: 0.5
  max_positions: 3
  min_position_usdt: 5.0
  trailing_stop_pct: 1.2
  tp_pct: 1.8
  sl_pct: 1.0
  blacklist_symbols: ["WLFIUSDT", "AZTECUSDT", "MYXUSDT"]

entry:
  transformer_threshold: 0.54
  max_liq_distance_pct: 1.30
  min_orderflow_imbalance: 1.03
  min_rr_ratio: 1.3
  min_target_profit_pct: 1.2
  min_stop_distance_pct: 0.35
  atr_stop_mult: 1.6
  liq_stop_buffer_atr: 0.35
  allowed_regimes: ["trend", "breakout", "chop"]
  breakout_lookback: 20
  pullback_lookback: 8
  level_tp_buffer_atr: 0.20

heatmap:
  cluster_step: 20
  max_levels: 10

atr:
  period: 14
  min_atr_pct: 0.20

exit:
  hard_sl_atr_mult: 1.8
  early_exit_bars: 8
  early_exit_min_profit_atr: 0.35
  trailing_activation_atr: 0.8
  trailing_distance_atr: 1.2
  tp_cap_atr_mult: 8.0

risk:
  max_daily_loss_pct: 2.5
  max_daily_loss_usdt: 10
  max_trades_per_day: 15
  max_consecutive_losses: 3
  cooldown_after_loss_sec: 300
  cooldown_after_stop_hours: 6
  max_trades_per_symbol_24h: 2
  reduce_after_losses: 1
  reduction_factor: 0.5

market:
  min_24h_volume_usdt: 15000000
  max_symbols: 15
  trade_symbols: 8
  whitelist_enabled: true
  whitelist_symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "ARBUSDT", "OPUSDT"]
  blacklist_substrings:
    - "1000"
    - "LUNA"
    - "UST"
    - "BUSD"

ai:
  enabled: true
  min_confidence: 52
  fail_open: true

rl:
  enabled: true
  add_threshold: 0.78
  reduce_threshold: 0.7
  close_threshold: 0.8
  min_close_profit_pct: 0.5
  max_panic_loss_pct: 0.6
  min_reduce_profit_pct: 0.8

position_sync:
  adopt_all_positions: true
  preserve_existing_sl_tp: true

partial_tp:
  enabled: true
  trigger_progress: 0.5
  close_fraction: 0.5
  move_stop_to_entry: true

portfolio_tp:
  enabled: false
  target_profit_pct: 2.0

basket_profit_guard:
  enabled: true
  min_positions: 3
  monitor_window_sec: 900
  symbol_pnl_drop_pct: 40.0
  total_drawdown_pct_after_symbol_drop: 15.0
  min_symbol_peak_profit_usdt: 0.5
  min_total_profit_usdt: 1.0

profit_drawdown_guard:
  enabled: true
  activation_profit_pct: 3.0
  retrace_from_peak_pct: 25.0

manual_management:
  rl_enabled: false
  preserve_existing_tp: true
  trailing_activation_atr: 1.6
  trailing_distance_atr: 2.4
  notify_on_adopt: true
  notify_on_partial_tp: true
  notify_on_sl_move: true

profit_lock:
  min_profit_pct: 5.0
  decline_threshold_pct: 20.0
  decline_duration_sec: 300
  cooldown_sec: 3600
