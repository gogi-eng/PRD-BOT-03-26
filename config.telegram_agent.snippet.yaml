# Секция telegram_signal_agent для config.yaml на сервере

telegram_signal_agent:
  enabled: true
  auto_execute: false
  market_scanner_enabled: false
  control_panel_enabled: false
  telegram_notify: true
  notify_only_approved: true
  audit_jsonl_enabled: false
  inbox_jsonl_enabled: true
  inbox_jsonl: reports/telegram_signals/signals_inbox.jsonl
  session_name: telegram_user_signal_agent
  # Пустой [] = слушать ВСЕ подписки (263+ канала — шум). Укажите только рабочие сигнальные каналы:
  allowed_chats:
    - "FibTrader | Крипта, Сигналы, Копитрейдинг"
    - "INVEX GROUP"
    - "Евгений Ковалёв | NextGen"
    - "Binance Killers®"
    - "Crypto Inner Circle®"
    - "Cornix Trading Signals (free)"
    - "Fed. Russian Insiders®"
    - "Wallstreet Queen Official®"
    - "Wolf of Trading®"
  ignored_substrings:
    - pocket
    - quotex
    - binolla
    - binary option
    - fantastishe
    - stationtrade
    - botfather
    - chatgpt
    - bybit комьюнити
    - bybit новости
  ignored_chats:
    - FantastisheBot
    - PocketOptions_1969_BOT
    - StationTradeeeeBot
    - "Pocket Option Bot Signals M1🤖"
    - "Pocket Option Bot Signals M15🤖"
    - "Quotex Signals M5 Bot 🤖"
    - "Quotex Signals Bot M1 🤖"
    - "Binolla Signals M1 🤖"
    - "Gavin Binary Option Signals 🐳"
    - "BYBIT Комьюнити"
    - "BYBIT Новости"
    - BotFather
    - Bullrunsignals
    - Cryptovolksignalbot
    - Labuh25Bot
  signal_parse_simple: true
  infer_side_from_sr: true
  require_stop_loss: true
  min_openrouter_confidence: 68
  signal_quality:
    enabled: true
    skip_noise_posts: true
    require_stop_loss: true
    min_structure_score: 58
    prefer_rule_based_when_structured: true
    openrouter_skip_if_structure_score_ge: 78
    openrouter_min_structure_score: 48
  trusted_signal_sources:
    - "FibTrader | Крипта, Сигналы, Копитрейдинг"
    - "INVEX GROUP"
    - "Евгений Ковалёв | NextGen"
  channel_prune:
    enabled: true
    inactive_hours: 24
    min_track_hours: 48
    auto_update_config: true
    notify_telegram: true
    never_prune: []
  state_path: telegram_signal_agent_state.json
  out_dir: reports/telegram_signals
  lookback_hours: 6
  duplicate_signal_cooldown_sec: 1800
  max_chats_once: 25
  scan_delay_sec: 0.35

