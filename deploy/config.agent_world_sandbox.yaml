# AGENT-WORLD sandbox — ветка 12.06.26-ALGO, субаккаунт Bybit.
# Путь на сервере: /root/AGENT-WORLD
# Установка: bash scripts/install_agent_world_config.sh
# .env: BYBIT_API_KEY/SECRET = ключи СУБАККАУНТА (отдельные от основного PRD-BOT-ALL).

bybit:
  api_key: ""
  api_secret: ""
  testnet: false
  category: linear
  # orderbook_ws не добавлять: config_validate extra=forbid; стакан WS — defaults в коде

# Фаза A: кеш read-запросов Bybit (цена, свечи, тикеры) + лимит параллелизма
api_cache:
  enabled: true
  price_ttl_sec: 8
  klines_ttl_sec: 45
  tickers_ttl_sec: 30
  orderbook_ttl_sec: 12
  trades_ttl_sec: 15
  max_parallel_requests: 6

timezone_offset: 3

telegram:
  bot_token: ""
  chat_id: ""
  channel_id: ""
  allowed_user_ids: []
  control_polling_enabled: true
  unified_control_panel: true

bot_manager:
  enabled: false
  interval_sec: 3600
  notify_telegram: true
  log_tail_lines: 35

# Read-only обзор позиций/графиков → кнопка «📡 Bybit AI» в Telegram-панели
bybit_monitor:
  enabled: true
  interval_sec: 300
  notify_telegram: false
  llm_summary: true
  kline_interval: "15"
  kline_limit: 96
  include_funding: true
  include_oi: true
  include_liquidations: true
  alert_upnl_change_usdt: 15.0
  max_symbols: 8

# Агент сопровождения открытых сделок (каждый цикл ~60 сек): TP/SL/закрытие
trade_companion:
  enabled: true
  bot_positions_only: true
  notify_telegram: true
  extend_tp_enabled: true
  extend_tp_min_profit_pct: 2.5
  extend_tp_min_progress_pct: 55
  close_giveback_enabled: true
  close_giveback_peak_min_pct: 2.0
  close_giveback_from_peak_pct: 45
  close_reversal_enabled: true
  tighten_sl_on_weakness: true

# Подробная статистика по каждой сделке (MFE/MAE, стакан, exit_context)
trade_lifecycle:
  enabled: true
  bot_positions_only: true
  sample_interval_sec: 300
  store_periodic_samples: true

trading:
  auto_start: true
  leverage: 10
  loop_interval_sec: 60
  adaptive_loop:
    enabled: true
    base_sec: 60
    active_sec: 45
    idle_sec: 120
    idle_after_quiet_min: 60
  max_positions: 8
  dynamic_leverage:
    enabled: true
    min: 10
    max: 15
    min_confidence: 0.68
    max_confidence: 0.95
  min_signal_confidence: 0.85
  min_own_agent_confidence: 0.82
  min_multi_agent_score: 0.4
  risk_pct_per_trade: 0.225
  active_strategy: swing
  strategies:
    # местное UTC+3: 9–10, 14–15, 20–23 (без 6–8, 11–13, 16–18)
    scalp_hours_local: [9, 10, 14, 15, 20, 21, 22, 23]
  min_24h_volume_usdt: 10000000
  max_scan_symbols: 24
  symbol_rescan_interval_sec: 900
  symbols:
    - BTCUSDT
    - ETHUSDT
  symbol_blacklist:
    - ATUSDT
    - CLOUSDT
    - DUSKUSDT
  block_entry_utc_hours:
    # МЕСТНОЕ UTC+3. Вечер NY — ny_open_block (DST: лето 16–18, зима 17–19 МСК)
    - 3
    - 6
    - 7
    - 8
    - 11
    - 12
    - 13
  # Коридор S↔R: отскок или пробой+подтверждение (песочница)
  zone_corridor_play:
    enabled: true
    require_play: true
    allow_bounce: true
    allow_breakout: true
    mid_range_skip: true
    edge_fraction: 0.28
    bounce_lookback_bars: 3
    bounce_wick_atr_mult: 0.35
    breakout_confirm_bars: 2
    # false = коридор проверяется и для SPIKE/scanner (иначе стратегия «зона↔зона» молчит)
    skip_fast_sources: false
    apply_to_sources:
      - own_multi_agent
      - ta_volatility
      - hybrid
      - spike_scalp
      - SPIKE_SCANNER
      - MARKET_SCANNER
      - market_scanner
    skip_sources:
      - telegram
      - tg
      - mirror_pump_dump
      - agent_world
      - world_feed
  non_trading_systemd:
    enabled: true
    stop_systemd: false
    pre_block_close:
      enabled: true
      losers_only: true
      min_profit_pct_to_keep: 0.0
      fee_buffer_pct: 0.12
      trend_lookback_bars: 3
      trend_kline_interval: "15"
    resume_before_minutes: 5
    ny_open_block:
      enabled: true
      # false только для отладки: иначе сб/вс и праздники США без блока 16–18 МСК
      skip_weekends: true
      skip_us_holidays: true
      market_tz: America/New_York
      market_open_local: "09:30"
      stop_before_open_minutes: 30
      block_hours: 3
  symbol_blacklist_substrings:
    - USDC
    - USDE
    - PEPE
    - PENG
    - FART
    - "1000"
    - BILL

risk:
  cooldown_after_loss_sec: 600
  cooldown_after_stop_minutes: 30
  daily_loss_blocks_until_next_day: true
  max_consecutive_losses: 4
  max_daily_loss_pct: 5.0
  max_daily_loss_usdt: 10
  max_trades_per_day: 50
  # Файл на сервере: touch data/kill_switch/STOP_TRADING — стоп новых входов
  kill_switch_file: data/kill_switch/STOP_TRADING
  kill_switch_hint: "удалите data/kill_switch/STOP_TRADING для возобновления"

# Пресеты риска — кнопки 🛡 Консерв / ⚖️ Норма / 🚀 Агресс в Telegram
entry_pipeline:
  enabled: true
  mode: balanced
  partial_pass_band: 1.2
  partial_pass_size_mult: 0.35
  regime_thresholds:
    enabled: true
    trend: 4.5
    chop: 5.0
    breakout: 4.8

# Apodex Priority-1: funding + OI + long/short ratio (только песочница)
derivatives_entry_guard:
  enabled: true
  advisory_only: true
  block_on_extreme_funding: true
  block_on_crowded_funding: false
  high_funding_threshold: 0.0005
  extreme_funding_threshold: 0.001
  oi_spike_pct_threshold: 5.0
  oi_spike_block_with_crowd: true
  oi_significant_pct: 5.0
  long_short_ratio:
    enabled: true
    block_on_crowd: true
    long_crowded_buy_ratio: 0.72
    short_crowded_buy_ratio: 0.28
    period: "1h"

# GARCH calm/normal/storm → множитель размера (Miles Deutscher / BeInCrypto идея).
# Не угадывает LONG/SHORT — только «погоду» рынка для размера позиции.
volatility_regime_sizing:
  enabled: true
  advisory_only: false
  block_on_storm: false
  mode: regime
  kline_interval: "15"
  lookback_bars: 200
  min_bars: 80
  alpha: 0.08
  beta: 0.90
  calm_percentile: 30
  storm_percentile: 70
  regimes:
    calm: 1.25
    normal: 1.0
    storm: 0.50
  clamp_min: 0.35
  clamp_max: 1.50
  skip_fast_sources: false
  apply_to_sources: []

# Wallet Flow Agent (v1): watch-кошельки → advisory рекомендации (НЕ ставит ордера).
# API-ключи только в .env: DEBANK_ACCESS_KEY и/или ETHERSCAN_API_KEY
wallet_tracker:
  enabled: true
  telegram_notify: true
  poll_interval_sec: 300
  min_swap_usd: 5000
  recommendation_ttl_sec: 3600
  symbol_cooldown_sec: 1800
  lookback_sec: 86400
  chains: ["eth"]
  watches:
    # Публичные адреса с Etherscan name tag / ENS (не выдуманы). MM = маркет-мейкеры — много шума.
    - address: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
      label: "vitalik_buterin"
      chain: eth
      # source: etherscan.io/address/0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045 (vitalik.eth)
    - address: "0x7a16fF8270133F063aAb6C9977183D9e72835428"
      label: "michael_egorov_curve"
      chain: eth
      # source: etherscan name tag «Michael Egorov»; Delphi Digital / The Block (Curve founder)
    - address: "0xDBF5E9c5206d0dB70a90108bf936DA60221dC080"
      label: "wintermute"
      chain: eth
      # source: etherscan.io/address/0xDBF5E9c5206d0dB70a90108bf936DA60221dC080 (Wintermute)
    - address: "0x4f3a120E72C76c22ae802D129F599BFDbc31cb81"
      label: "wintermute_multisig"
      chain: eth
      # source: etherscan.io/address/0x4f3a120E72C76c22ae802D129F599BFDbc31cb81 (Wintermute: Multisig)
    - address: "0xf584F8728B874a6a5c7A8d4d387C9aae9172D621"
      label: "jump_trading"
      chain: eth
      # source: etherscan.io/address/0xf584F8728B874a6a5c7A8d4d387C9aae9172D621 (Jump Trading)
    - address: "0xddAcAd3B1edee8E2F5b2e84f658202534fcb0374"
      label: "dwf_labs"
      chain: eth
      # source: etherscan.io/address/0xddAcAd3B1edee8E2F5b2e84f658202534fcb0374 (DWF Labs)
    - address: "0xD4B69e8D62C880E9DD55d419d5E07435C3538342"
      label: "dwf_labs_2"
      chain: eth
      # source: etherscan.io/address/0xD4B69e8D62C880E9DD55d419d5E07435C3538342 (DWF Labs)
    - address: "0x05E793cE0C6027323Ac150F6d45C2344d28B6019"
      label: "a16z"
      chain: eth
      # source: etherscan.io/address/0x05E793cE0C6027323Ac150F6d45C2344d28B6019 (a16z); активность может быть редкой
    - address: "0x5b990C664aE7E759763ACfEC76E11c289c53Be77"
      label: "amber_group"
      chain: eth
      # source: etherscan.io/address/0x5b990C664aE7E759763ACfEC76E11c289c53Be77 (Amber Group)


multi_agent_review:
  enabled: true
  advisory_only: true
  block_on_bear_majority: false
  min_consensus_votes: 2

risk_presets:
  conservative:
    trading:
      min_signal_confidence: 0.88
      risk_pct_per_trade: 0.375
    quality_gate:
      min_rr_ratio: 2.2
      min_confidence: 0.88
    signals:
      min_analysis_confidence: 0.90
    entry_pipeline:
      mode: strict
  normal:
    trading:
      min_signal_confidence: 0.85
      risk_pct_per_trade: 0.525
    quality_gate:
      min_rr_ratio: 2.0
      min_confidence: 0.85
    signals:
      min_analysis_confidence: 0.88
    entry_pipeline:
      mode: balanced
  aggressive:
    trading:
      min_signal_confidence: 0.80
      risk_pct_per_trade: 0.675
    quality_gate:
      min_rr_ratio: 1.8
      min_confidence: 0.80
    signals:
      min_analysis_confidence: 0.85
    entry_pipeline:
      mode: aggressive

# Фаза 1 soak: SPIKE + own_agents. Остальное выкл до проверки PnL по source.
# Дальше по плану: 2) BOS scanner  3) TA  4) TG-inbox  5) whale/ext  6) RSS auto
signals:
  own_agents_enabled: true
  telegram_inbox_enabled: false
  telegram_signals_jsonl: reports/telegram_signals/signals_inbox.jsonl
  telegram_inbox_only_approved: true
  telegram_inbox_backlog_lines: 100
  min_telegram_confidence: 0.65
  min_analysis_confidence: 0.88
  min_multi_agent_score: 0.4
  signal_notify_cooldown_sec: 900
  whale_news_enabled: false

external_sentiment:
  cache_sec: 3600
  enabled: false
  coinugget_style:
    enabled: true
    kline_interval: '15'
    klines_limit: 60
    max_symbols: 20
    min_confidence: 0.68
    rsi_overbought: 70
    rsi_oversold: 30
    rsi_period: 14
    volume_spike_mult: 2.0

ta_scanner:
  enabled: false
  min_24h_change_pct: 1.0
  min_intraday_range_pct: 0.8
  max_symbols: 15
  interval: "15"
  kline_limit: 120
  parallel_klines: 5
  min_confidence: 0.82
  atr_sl_mult: 1.2
  atr_tp_mult: 2.5
  min_rr: 2.0
  rsi_buy_min: 38
  rsi_buy_max: 68
  rsi_sell_min: 32
  rsi_sell_max: 62

portfolio_tp:
  enabled: true
  target_profit_pct: 2.0
  skip_manual_positions: true
  min_bot_positions: 2
profit_lock:
  min_profit_pct: 5.0
  decline_threshold_pct: 20.0
  decline_duration_sec: 300
  cooldown_sec: 3600
  skip_manual_positions: true
positions:
  adopt_manual: true
  session_boundary_close:
    enabled: false
  trailing_enabled: true
  # 26.07: длинный трейлинг — больше запас на откат (не закрывать у локального min/max)
  liquidation_guard:
    enabled: true
    buffer_pct: 0.85
    skip_manual: true
    emergency_close: true
  # Обратный сигнал (own/SPIKE/TG) → market-close на Bybit
  reverse_signal_close_enabled: true
  opposite_signal_exit:
    enabled: true
    # SPIKE не закрывать по обратному own-сигналу (кейс DEXE)
    skip_spike_on_own_signal: true
    # Песочница: не закрывать младше 20 мин / слабее 68% (кейс XAUUSDT 15 мин flip)
    min_position_age_min: 20
    min_confidence_pct: 68
  lock_initial_sl: false
  trailing_activation_pct: 2.5
  trailing_distance_pct: 3.5
  trailing_distance_atr_mult: 2.2
  trailing_min_distance_pct: 1.8
  breakeven_after_pct: 2.0
  notify_trailing_telegram: false
  exit_management:
    enabled: true
    time_stop_enabled: true
    time_stop_minutes: 120
    time_stop_min_atr_progress: 0.25
    close_on_time_stop: true
    early_breakeven_enabled: false
    early_breakeven_atr_mult: 1.2
    early_breakeven_pct: 0.9
    late_breakeven_enabled: true
    late_breakeven_retrace_pct: 40
    close_on_late_retrace: false
    late_tighten_distance_factor: 1.0
  tp_progress_exit:
    enabled: true
    breakeven_at_profit_pct: 1.0
    sr_trail_at_profit_pct: 1.5
    be_fee_buffer_pct: 0.30
    be_lock_extra_pct: 0.40
    sr_trail_enabled: true
    sr_sl_buffer_atr: 0.22
    sr_level_index: 1
    min_valid_tp_distance_pct: 0.08
  pump_dump_trailing:
    trailing_activation_pct: 2.5
    trailing_distance_pct: 3.5
    trailing_distance_atr_mult: 2.2
    trailing_min_distance_pct: 1.8
    breakeven_after_pct: 2.0
    exit_management:
      early_breakeven_enabled: false
      late_tighten_distance_factor: 0.90
    tp_progress_exit:
      enabled: true
      breakeven_at_profit_pct: 1.0
      sr_trail_at_profit_pct: 1.5
      be_fee_buffer_pct: 0.30
      be_lock_extra_pct: 0.40
      sr_trail_enabled: true
      sr_sl_buffer_atr: 0.22
      sr_level_index: 1
      min_valid_tp_distance_pct: 0.08
  adaptive_trailing:
    enabled: true
    lookback_bars: 3
    fast_move_pct: 1.0
    slow_move_pct: 0.3
    tight_distance_factor: 0.85
    normal_distance_factor: 1.0
    apply_to_manual: true
    apply_to_pump_dump: true
    apply_to_bot: true
  # После BE/BE+: чуть шире trailing (больше «воздуха» на откат)
  trailing_after_be:
    enabled: true
    widen_mult: 1.2
  fee_breakeven:
    taker_rate: 0.00055
    maker_rate: 0.0002
    entry_as_maker: false
    exit_as_maker: false
    slippage_margin_pct: 0.06
    fee_multiplier: 2.0
    include_funding: true
    funding_interval_hours: 8
    funding_rate_assumed: 0.0001
    funding_reserve_hours: 24
    funding_rate_cap: 0.001

manual_management:
  set_exchange_levels_on_adopt: false
  manual_trailing_activation_atr: 2.2
  manual_trailing_distance_atr: 3.5
  manual_trailing_min_distance_pct: 0.55

position_sync:
  preserve_existing_sl_tp: true
  alert_on_mismatch: true
  alert_registry_mismatch: false
  auto_clean_stale_registry: true
  auto_close_journal_ghosts: true
  alert_cooldown_sec: 3600
  max_mismatch_alerts_per_cycle: 1

# Вход по зонам SMC / BOS / ретест (engine/entry_engine → prd_agent)
zone_entry:
  enabled: true
  kline_interval: "15"
  prefer_bos_retest: true
  entry_at_zone: mid
  retest_watchlist:
    enabled: true
    ttl_minutes: 90
    scan_candles: 12
  require_impulse_retest: true
  skip_pullback_when_retest_ok: true
  require_entry_engine_pass: false
  block_if_no_zone: false
  sources:
    - own_multi_agent
    - ta_volatility
    - hybrid
  skip_sources_with_levels:
    - telegram
    - tg
    - mirror_pump_dump

orderbook_entry:
  enabled: true
  depth_levels: 200
  trades_limit: 120
  orderflow_depth: 25
  wall_threshold_mult: 2.0
  direction_guard_enabled: true
  direction_guard_ratio: 1.3
  block_on_direction_guard: true
  fallback_on_fetch_error: true
  # Hermes spread_wide: не входить при широком спреде (spread_pct в %)
  max_spread_pct: 0.12
  block_on_spread_guard: true

execution_sr_zones:
  enabled: true
  kline_interval: "15"
  kline_limit: 120
  sl_sr_level_index: 1
  sl_extra_buffer_atr: 0.18
  tp_extra_buffer_atr: 0.08
  preserve_min_rr: 2.0
  prefer_far_tp: true
  tp_sr_level_index: 2
  target_initial_tp_rr: 6.0
  min_tp_distance_pct: 1.0

pullback_entry:
  enabled: true
  momentum_bars: 5
  min_momentum_pct: 0.35
  min_retrace_pct: 0.12
  retrace_lookback_bars: 5
  require_counter_bars: 1
  skip_for_pump_dump: true

# Сигналы Mirror pump/dump: без отката, market-вход, быстрый трейлинг
pump_dump_trade:
  enabled: false
  min_confidence: 0.65
  min_rr_ratio: 1.5
  inbox_replay_sec: 7200
  max_market_drift_pct: 0.012
  max_limit_drift_pct: 0.018
  max_skip_drift_pct: 0.03

entry_guard:
  enabled: true
  max_market_drift_pct: 0.006
  max_limit_drift_pct: 0.01
  max_skip_drift_pct: 0.015
  telegram_limit_entry: true
  telegram_sources:
    - telegram
    - tg
    - tg_inbox

bot:
  signal_only: false
  signal_cooldown_sec: 3600

entry:
  entry_threshold: 0.58
  entry_threshold_soft: 0.55
  min_volatility_pct: 0.06
  volatility_floor_enabled: true
  volatility_floor_atr_pct: 0.06
  require_4h_trend: false
  strict_htf_mode: true
  # Hermes 04.07: orderflow — главный блокер входов; тест 1.20 только песочница
  min_orderflow_imbalance: 1.20
  max_spread_pct: 0.12
  min_smc_score: 0.60
  ema_guard_min_diff_pct: 0.30
  momentum_guard_min_pct: 0.15
  buy_momentum_guard_min_pct: 0.35
  sell_momentum_guard_min_pct: 0.15
  volume_guard_min_ratio: 0.35
  buy_volume_guard_min_ratio: 0.50
  sell_volume_guard_min_ratio: 0.35
  impulse_min_body_atr: 0.45
  retest_max_body_ratio: 0.85
  early_exit_bars: 45
  early_exit_min_profit_atr: 0.35
  ema_exit_confirm_bars: 3
  trained_model_enabled: true
  trained_model_min_prob: 0.52
  trained_model_blend: 0.15
  trained_model_weights_path: transformer_weights.pt

adaptive_regime_presets:
  enabled: true
  switch_interval_sec: 900
  notify_on_switch: true
  benchmark_symbol: BTCUSDT
  trend_strict_htf_mode: true
  trend_volatility_floor_atr_pct: 0.06
  trend_require_4h_trend: false
  range_strict_htf_mode: false
  range_volatility_floor_atr_pct: 0.02
  range_require_4h_trend: false

trade_journal:
  rotate_max_mb: 8
  rotate_keep_files: 14

# Soft-score: ослабить правила с отрицательным lift (прод + песочница)
rule_weight_learning:
  enabled: true
  lookback_days: 14
  min_samples: 5
  min_win_rate: 0.52
  min_total_pnl: 0.0
  max_weight_mult: 1.35
  max_size_mult: 1.12
  max_confidence_boost: 0.05
  refresh_interval_sec: 3600
  favorable_threshold: 65
  neutral_threshold: 50
  caution_threshold: 40
  weight_overrides:
    regime_trend: 0.55
    adx_ok: 0.55
    adx_strong: 0.55
    imb_strong: 0.55

quality_gate:
  enabled: true
  min_confidence: 0.85
  min_rr_ratio: 2.0
  require_sl_tp: true
  min_24h_volume_usdt: 10000000
  block_meme_symbol_substrings:
    - USDC
    - USDE
    - PEPE
    - PENG
    - FART
    - "1000"
    - BILL

supervisor_v4:
  enabled: true
  interval_hours: 2
  tick_every_cycles: 15
  mode_cooldown_minutes: 120
  min_risk_pct: 0.15
  lookback_hours: 168
  virtual_trades_enabled: true
  virtual_max_open: 40
  virtual_max_age_hours: 72
  seed_blocked_symbols:
    - ATUSDT
    - CLOUSDT
    - DUSKUSDT
  seed_blocked_utc_hours:
    # МЕСТНОЕ UTC+3 (Москва), НЕ UTC; синхрон с block_entry_utc_hours
    - 3
    - 6
    - 7
    - 8
    - 11
    - 12
    - 13
  preferred_utc_hours:
