market_scanner:
  enabled: true
  bos_scan_enabled: false
  interval_sec: 300
  run_loop_in_unified_bot: true
  run_loop_in_signal_agent: false
  spike_scalp:
    enabled: true
    # Явные флаги цикла (как после fix 5945321); на AW SPIKE идёт в unified bot.
    run_loop_in_unified_bot: true
    run_loop_in_signal_agent: false
    interval_sec: 90
    kline_interval: "15"
    min_move_pct: 4.0
    min_24h_volume_usdt: 8000000
    max_symbols: 50
    top_n: 1
    # ЛАЙТ 28.07: чуть дольше cooldown — меньше повторных входов в ту же «памп»-монету
    symbol_cooldown_sec: 2400
    auto_execute: true
    execute_min_score: 72
    # ЛАЙТ 28.07: объём должен подтверждать импульс (аналог «живой интерес», без on-chain)
    min_volume_ratio: 1.40
    sl_buffer_pct: 0.25
    min_rr: 1.5
    use_closed_candle: false
    use_dynamic_leverage: true
    max_positions_bypass_min_score: 88
    extra_position_slots: 2
    # SPIKE: ждать откат в FVG/зону или входить сразу, если отката не ждут.
    pullback_entry:
      enabled: true
      wait_timeout_sec: 300
      # ЛАЙТ 28.07: чуть глубже откат — меньше погонь за вершиной импульса
      min_retrace_pct: 0.18
      require_fvg: false
      enter_immediate_if_no_fvg: true
      enter_immediate_if_book_confirms: true
      multi_tf_intervals: ["1", "5", "15"]
      orderbook_depth: 50
      direction_guard_ratio: 1.3
      min_fvg_pct: 0.12
      impulse_extend_pct: 0.25
      absorption_ratio: 1.2
      synthetic_retrace_pct: 0.20
      watchlist_max: 12
    # Не входить SPIKE против часового (1h) тренда (после убытка BANKUSDT).
    # Исключение: разворот у S/R или продолжение после пробоя уровня на HTF.
    require_htf_trend_align: true
    htf_trend_intervals: ["60"]
    htf_allow_neutral: true
    htf_kline_limit: 80
    htf_sr_context_enabled: true
    htf_sr_near_pct: 0.35
    htf_allow_against_at_sr: true
    htf_allow_against_on_breakout: true
    htf_sr_breakout_lookback_bars: 3
  scanner_reversal_exit:
