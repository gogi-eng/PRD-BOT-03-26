# Продакшен-шаблон: install → config.copy_mirror.yaml в корне

copy_mirror:
  enabled: true
  poll_seconds: 12
  main_uid: "461368408"
  sub_uid: "536308614"
  close_when_source_closes: true
  notify_telegram: true
  state_file: data/copy_mirror/state.json

  profit:
    min_pct: 0.12
    max_pct: 1.5
    max_watch_minutes: 45

  trading:
    risk_pct: 1.0
    max_positions: 3
    leverage: 10
    min_notional_usdt: 5

  quality_gate:
    enabled: true
    min_confidence: 0.68
    min_rr_ratio: 2.0
    require_sl_tp: false
    min_24h_volume_usdt: 10000000

  risk:
    max_daily_loss_pct: 5
    max_trades_per_day: 15

  pump_dump_agent:
    enabled: true
    daily_rebuild_hour_utc: 0
    scan_every_minutes: 15
    move_threshold_pct: 5.0
    lookback_candles: 4
    symbol_limit: 120
    min_turnover_usdt: 1000000
    score_threshold: 0.60
    signal_cooldown_minutes: 180
    target_inbox_path: /root/PRD-BOT-ALL/reports/telegram_signals/signals_inbox.jsonl
    state_file: data/copy_mirror/pump_dump_state.json

telegram:
  bot_token: ""
  chat_id: ""
