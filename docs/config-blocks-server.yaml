# Полный эталон config для сервера PRD-BOT-ALL (ветка 29.05.26-OPT-ALL).
# Рекомендуется НЕ править вручную, а установить скриптом:
#   cd /root/PRD-BOT-ALL && git pull && bash scripts/install_production_config.sh
# Секреты (Bybit/Telegram/OpenRouter) остаются в .env — в yaml ключи пустые.

# См. deploy/config.production.yaml — единственный источник правды.
# Ключевые блоки для входа/ведения/риска:

risk:
  cooldown_after_loss_sec: 600
  cooldown_after_stop_minutes: 30
  daily_loss_blocks_until_next_day: true
  max_consecutive_losses: 4
  max_daily_loss_pct: 5.0
  max_daily_loss_usdt: 50
  max_trades_per_day: 8

positions:
  adopt_manual: true
  trailing_enabled: true
  trailing_activation_pct: 1.35
  trailing_distance_pct: 1.55
  trailing_distance_atr_mult: 2.5
  trailing_min_distance_pct: 0.65
  breakeven_after_pct: 1.05
  notify_trailing_telegram: false
  exit_management:
    enabled: true
    time_stop_enabled: true
    time_stop_minutes: 120
    time_stop_min_atr_progress: 0.25
    close_on_time_stop: true
    early_breakeven_enabled: false
    early_breakeven_atr_mult: 1.2
    early_breakeven_pct: 0.9
    late_breakeven_enabled: true
    late_breakeven_retrace_pct: 40
    close_on_late_retrace: false
    late_tighten_distance_factor: 0.85
  tp_progress_exit:
    enabled: true
    breakeven_at_progress_pct: 62
    sr_trail_at_progress_pct: 80
    min_profit_pct_for_be: 1.2
    be_fee_buffer_pct: 0.05
    sr_trail_enabled: true
    sr_sl_buffer_atr: 0.22
    sr_level_index: 1
    min_valid_tp_distance_pct: 0.08

execution_sr_zones:
  enabled: true
  kline_interval: "15"
  kline_limit: 120
  sl_sr_level_index: 1
  sl_extra_buffer_atr: 0.18
  tp_extra_buffer_atr: 0.08
  preserve_min_rr: 0

pullback_entry:
  enabled: true
  momentum_bars: 5

entry_guard:
  enabled: true
  max_market_drift_pct: 0.006
  max_limit_drift_pct: 0.01
  max_skip_drift_pct: 0.015
  telegram_limit_entry: true
  telegram_sources:
    - telegram
    - tg
    - tg_inbox

quality_gate:
  enabled: true
  min_confidence: 0.90
  min_rr_ratio: 2.0
  require_sl_tp: true
  min_24h_volume_usdt: 10000000
  block_meme_symbol_substrings:
    - USDC
    - USDE
    - PEPE
    - PENG
    - FART
    - "1000"
    - BILL
