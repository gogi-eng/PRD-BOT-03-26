# Скопируйте: copy config.example.yaml config.yaml
# Ключи можно также задать в .env (BYBIT_*, TELEGRAM_*, TESTNET=true)

bybit:
  api_key: ""
  api_secret: ""
  testnet: false         # Боевая торговля (минимальный депозит). Testnet: true
  category: linear

telegram:
  bot_token: ""
  chat_id: ""            # личный чат для уведомлений и кнопок
  channel_id: ""         # канал для bi-hourly (может = chat_id)
  allowed_user_ids: []   # пусто = все; иначе список user id
  # true — кнопки и таблица /panel (если 409 Conflict — поставьте false)
  control_polling_enabled: true

trading:
  # Автоскан: пары с оборотом 24ч >= min_24h_volume_usdt (turnover24h на Bybit)
  min_24h_volume_usdt: 10000000
  max_scan_symbols: 12
  symbol_rescan_interval_sec: 1800
  # Всегда в списке скана (в начале), даже если объём ниже порога
  symbols:
    - BTCUSDT
    - ETHUSDT
  symbol_blacklist: []
  symbol_blacklist_substrings:
    - USDC
    - USDE
  leverage: 5
  risk_pct_per_trade: 0.5
  max_positions: 4
  min_signal_confidence: 0.90
  min_own_agent_confidence: 0.90
  min_multi_agent_score: 0.4
  loop_interval_sec: 60
  auto_start: true   # старт торговли сразу при запуске run_unified.py

risk:
  max_daily_loss_pct: 5.0
  max_daily_loss_usdt: 50.0
  max_consecutive_losses: 4
  max_trades_per_day: 20
  cooldown_after_loss_sec: 300
  cooldown_after_stop_hours: 2
  daily_loss_blocks_until_next_day: true

signals:
  own_agents_enabled: true
  telegram_inbox_enabled: true

ta_scanner:
  enabled: true
  min_24h_change_pct: 1.0
  min_intraday_range_pct: 0.8
  max_symbols: 15
  interval: "15"
  kline_limit: 120
  min_confidence: 0.90
  atr_sl_mult: 1.2
  atr_tp_mult: 2.5
  min_rr: 2.0
  # Файл, куда пишет scripts/telegram_signal_agent.py (ОТДЕЛЬНЫЙ процесс на сервере!)
  telegram_signals_jsonl: "reports/telegram_signals/signals_inbox.jsonl"
  telegram_inbox_only_approved: true
  telegram_inbox_backlog_lines: 100
  min_telegram_confidence: 0.90
  min_analysis_confidence: 0.90
  min_multi_agent_score: 0.4
  signal_notify_cooldown_sec: 900
  whale_news_enabled: true

# Сопровождение позиций с биржи (в т.ч. открытых вручную на Bybit)
positions:
  adopt_manual: true
  trailing_enabled: true
  # Когда начать подтягивать SL (% прибыли от входа)
  trailing_activation_pct: 0.5
  # Отступ SL от лучшей цены: % от текущего пика (0.8 = 0.8%). Больше = дальше от графика
  trailing_distance_pct: 0.8
  # Минимум отступа в ATR (15m), если волатильность выше процента
  trailing_distance_atr_mult: 1.4
  breakeven_after_pct: 0.35

# Поджатие SL/TP к зонам поддержки/сопротивления (FVG/OB/swing) перед ордером unified-бота
execution_sr_zones:
  enabled: true
  kline_interval: "15"
  kline_limit: 120
  sl_extra_buffer_atr: 0.1
  tp_extra_buffer_atr: 0.08
  preserve_min_rr: 0   # 0 = взять quality_gate.min_rr_ratio

# Коллектор сигналов из Telegram-каналов (отдельная служба telegram_signal_agent)
telegram_signal_agent:
  enabled: true
  auto_execute: false
  notify_only_approved: true
  audit_jsonl_enabled: false
  inbox_jsonl: reports/telegram_signals/signals_inbox.jsonl
  signal_parse_simple: true
  signal_quality:
    enabled: true
    skip_noise_posts: true
    min_structure_score: 58
  session_name: telegram_user_signal_agent
  allowed_chats: []
  ignored_chats:
    - FantastisheBot
    - PocketOptions_1969_BOT
  state_path: telegram_signal_agent_state.json
  out_dir: reports/telegram_signals
  lookback_hours: 6
  duplicate_signal_cooldown_sec: 1800

whale_news:
  rss_urls:
    - "https://feeds.feedburner.com/CoinDesk"
    - "https://cointelegraph.com/rss"
  liquidation_usd_threshold: 500000
  oi_change_pct_threshold: 3.0
  news_keywords_bull: ["etf approved", "rate cut", "institutional", "partnership", "upgrade"]
  news_keywords_bear: ["hack", "exploit", "ban", "lawsuit", "sec", "crash", "liquidation"]

reporter:
  interval_hours: 2
  high_confidence_threshold: 0.90

self_improvement:
  enabled: true
  auto_apply_low_risk: true
  require_approval_critical: true
  sandbox_dir: "data/sandbox"
  git_auto_commit: false
  reload_config_after_apply: true

global_analysis:
  enabled: true
  interval_hours: 6

quality_gate:
  enabled: true
  min_confidence: 0.90
  min_rr_ratio: 2.0   # 2.5 режет все own_multi_agent (RR≈2.0) — сделок не будет
  require_sl_tp: true
  min_24h_volume_usdt: 10000000

# Переобучение transformer (скрипт scripts/daily_feedback_retrain.sh в 00:00 UTC)
feedback_loop:
  enabled: true
  retrain_in_process: false          # false = обучение только вне бота (systemd timer)
  retrain_daily: true
  retrain_hour_utc: 0                # для in-process; внешний timer всегда 00:00 UTC
  min_new_labels_for_retrain: 50
  dataset_path: signal_only_feedback_data.json
  base_dataset_path: training_data.json
  use_merged_dataset_for_retrain: true
  train_epochs: 220
  train_lr: 0.002
  train_batch_size: 32

analytics:
  report_hours: 24

ai:
  provider: openrouter   # на сервере без FCC: openrouter; с fcc-server: fcc

free_claude_code:
  enabled: false
  base_url: http://127.0.0.1:8082
  auth_token: freecc
  model: claude-3-5-haiku-20241022
  timeout_sec: 30

openrouter:
  api_key: ""   # или OPENROUTER_API_KEY в .env
  model: google/gemini-2.0-flash-001
  timeout_sec: 30

macro_ai:
  enabled: true
  max_headlines: 8
  include_positions: true
